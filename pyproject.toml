[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "greeks-computation-benchmark"
version = "0.1.0"
description = "Benchmarking numerical methods for computing option Greeks"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "torch",
    "pandas",
    "scipy",
    "ipykernel",
    "plotly",
    "nbformat>=4.2.0"
]

[tool.setuptools]
packages = ["src"]
